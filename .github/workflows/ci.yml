name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The whole suite takes five minutes. Twice, on 2026-09-07 and -08, a
    # Windows run sat at one wizard test for the six hours GitHub allows, with
    # every test before it green. A hang that is not cut off reports nothing.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      # `.python-version` says 3.12, and `uv run` obeys it over whatever `uv
      # sync --python` built: it threw the 3.13 environment away and tested
      # 3.12 nine times. The variable outranks the file, for sync and run alike.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest

  firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Its own network namespace and NET_ADMIN: a `policy drop` in here cannot
      # reach the runner that has to report the result.
      - name: Apply a real ruleset to a real machine
        run: |
          docker run --rm --cap-add=NET_ADMIN --cap-add=NET_RAW \
            -v "$PWD:/warden" -w /warden python:3.13-slim \
            bash -euo pipefail -c '
              apt-get -qq update
              apt-get -qq install -y --no-install-recommends nftables > /dev/null
              pip install -q .
              bash ./scripts/firewall-smoke.sh
            '

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Tokens that live as long as this run
        run: |
          echo "WARDEN_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "WARDEN_CLUSTER_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # --wait returns only once every healthcheck has passed, so this exercises
      # the HEALTHCHECK in the image and not merely the build.
      - name: Build the image and bring the three wardens up
        run: docker compose up --detach --build --wait

      # A node announces itself as it starts, but the hub writing that down is
      # not something the healthcheck waits for.
      - name: The hub knows both nodes
        run: |
          cat > seen.py <<'PY'
          import json, sys

          nodes = {n["name"]: n["status"] for n in json.load(open("nodes.json"))}
          missing = [n for n in ("build-01", "build-02") if nodes.get(n) != "online"]
          if missing:
              sys.exit(f"the hub does not have {missing} online: {nodes}")
          PY
          for _ in $(seq 30); do
            docker compose exec -T hub warden nodes --json > nodes.json
            if python3 seen.py > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          python3 seen.py

      - name: A port asked for through the hub is handed out by the node
        run: |
          docker compose exec -T hub warden register ci-app --kind api --node build-01 --json > port.json
          docker compose exec -T hub warden ls --all --json > fleet.json
          python3 - <<'PY'
          import json, sys

          port = json.load(open("port.json"))["port"]
          fleet = json.load(open("fleet.json"))
          if fleet["unreachable"]:
              sys.exit(f"the hub could not reach {fleet['unreachable']}")
          found = [s for s in fleet["services"] if s["name"] == "ci-app"]
          if len(found) != 1:
              sys.exit(f"expected ci-app once across the fleet, got {found}")
          if (found[0]["node"], found[0]["port"]) != ("build-01", port):
              sys.exit(f"ci-app should be on build-01 at {port}: {found[0]}")
          PY

      - name: What the wardens said
        if: always()
        run: docker compose logs

      - name: Tear it down
        if: always()
        run: docker compose down --volumes
