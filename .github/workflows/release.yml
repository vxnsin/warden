name: Release

# Publishing happens on a tag, so what reaches PyPI is always a commit that
# exists in the history under a name anyone can check out.
on:
  push:
    tags: ["v*"]

# Nothing is granted that a job does not ask for by name.
permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The steps below run code out of the repository, which has no
          # business holding a token that can write back to it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: PyPI checks who GitHub says this is, so there is no
    # token stored anywhere to leak or to rotate.
    permissions:
      id-token: write
    steps:
      # Pinned to commits rather than moving tags. This job holds the identity
      # that can publish, so what it runs must not be able to change under it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1
