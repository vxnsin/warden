name: Release

# Publishing happens on a tag, so what reaches PyPI is always a commit that
# exists in the history under a name anyone can check out.
on:
  push:
    tags: ["v*"]

# Nothing is granted that a job does not ask for by name.
permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      # Outranks `.python-version`, which `uv run` would otherwise obey. See ci.yml.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The steps below run code out of the repository, which has no
          # business holding a token that can write back to it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      # A version number on PyPI can never be reused, so a tag that disagrees
      # with pyproject.toml has to stop here rather than upload the wrong one.
      - name: Check the tag against the version
        run: |
          version=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Trusted publishing: PyPI checks who GitHub says this is, so there is no
    # token stored anywhere to leak or to rotate.
    permissions:
      id-token: write
    steps:
      # Pinned to commits rather than moving tags. This job holds the identity
      # that can publish, so what it runs must not be able to change under it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
