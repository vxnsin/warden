# `warden` is taken on PyPI by an unrelated project, so the distribution is
# named after what it does. The command it installs stays `warden`.
[project]
name = "warden-ports"
version = "0.2.0"
description = "Nothing binds a port without asking. A registry that hands out local ports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vensin" }]
keywords = ["ports", "registry", "service-discovery", "port-allocation", "development", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "packaging>=24.2",
    "platformdirs>=4.3",
    "pydantic>=2.9",
    "psutil>=6.1",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "textual>=1.0",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/vxnsin/warden"
Issues = "https://github.com/vxnsin/warden/issues"

[project.scripts]
warden = "warden.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
