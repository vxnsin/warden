[project]
name = "port-manager"
version = "0.1.0"
description = "Central port registry for local development services."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vensin" }]
keywords = ["ports", "registry", "service-discovery", "development", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "textual>=1.0",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.urls]
Homepage = "https://github.com/vxnsin/port-manager"
Issues = "https://github.com/vxnsin/port-manager/issues"

[project.scripts]
port-manager = "port_manager.cli:main"
portman = "port_manager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/port_manager"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
